<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-2">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/dashboard}">
            <i class="bi bi-kanban-fill text-primary me-2 fs-4"></i>
            <span>BilanProjets <small class="badge bg-secondary fs-6 fw-normal">v1.0</small></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i> Tableau de bord
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/projets}">
                        <i class="bi bi-folder2-open me-1"></i> Tous les Projets
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('ROLE_RESPONSABLE')">
                    <a class="nav-link" th:href="@{/projets(mesProjets=true)}">
                        <i class="bi bi-person-workspace me-1"></i> Mes Projets Assignés
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/synthese}">
                        <i class="bi bi-file-earmark-bar-graph me-1"></i> Synthèse Annuelle
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('ROLE_ADMIN')">
                    <a class="nav-link" th:href="@{/utilisateurs}">
                        <i class="bi bi-people-fill me-1"></i> Utilisateurs & Rôles
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning" th:href="@{/swagger-ui.html}" target="_blank">
                        <i class="bi bi-braces me-1"></i> Swagger API
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center">
                <div class="dropdown me-3" sec:authorize="isAuthenticated()">
                    <button class="btn btn-outline-light btn-sm dropdown-toggle d-flex align-items-center" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle fs-5 me-2"></i>
                        <span sec:authentication="name" class="fw-semibold"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li class="dropdown-header">Rôle & Habilitations</li>
                        <li class="px-3 py-1">
                            <span sec:authorize="hasAuthority('ROLE_ADMIN')" class="badge bg-danger">ADMINISTRATEUR</span>
                            <span sec:authorize="hasAuthority('ROLE_RESPONSABLE')" class="badge bg-primary">RESPONSABLE PROJET</span>
                            <span sec:authorize="hasAuthority('ROLE_OBSERVATEUR_GENERAL')" class="badge bg-info text-dark">OBSERVATEUR GÉNÉRAL</span>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-2">
                                <button type="submit" class="dropdown-item text-danger rounded">
                                    <i class="bi bi-box-arrow-right me-2"></i> Déconnexion
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>
</html>
